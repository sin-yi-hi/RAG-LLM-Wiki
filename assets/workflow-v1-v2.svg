<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b4f5c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d04545"/></marker>
    <style>
      .p{fill:#e6eefc;stroke:#2f6fde;stroke-width:2}
      .c{fill:#fdeee6;stroke:#e8743b;stroke-width:2}
      .n{fill:#e4f5ec;stroke:#2e9d6a;stroke-width:2.5}
      .t{font-size:16px;font-weight:700;fill:#1f2430;text-anchor:middle}
      .f{stroke:#4b4f5c;stroke-width:2;fill:none;marker-end:url(#a)}
      .l{stroke:#d04545;stroke-width:2;fill:none;marker-end:url(#r)}
      .h{font-size:16px;font-weight:700}
      .note{font-size:13px;fill:#d04545;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1000" height="290" fill="#fbf9f5"/>

  <text x="20" y="30" class="h" fill="#d04545">v1（第一次執行）：檢查只放在最後</text>
  <rect x="20" y="48" width="150" height="50" rx="10" class="p"/><text x="95" y="79" class="t">查詢 Wiki</text>
  <rect x="230" y="48" width="170" height="50" rx="10" class="p"/><text x="315" y="79" class="t">直接產生 HTML</text>
  <rect x="460" y="48" width="150" height="50" rx="10" class="c"/><text x="535" y="79" class="t">簡報檢查</text>
  <path class="f" d="M170 73 H228"/><path class="f" d="M400 73 H458"/>
  <path class="l" d="M535 98 C535 135, 315 135, 315 100"/>
  <text x="425" y="140" class="note">10 個錯誤：補洞式修改</text>
  <text x="640" y="68" font-size="13.5" fill="#1f2430">✗ 術語順序錯了，要整頁重排</text>
  <text x="640" y="90" font-size="13.5" fill="#1f2430">✗ 數字是 AI 自己加的，最後才發現</text>

  <line x1="20" y1="160" x2="980" y2="160" stroke="#e3ddd2" stroke-width="2"/>

  <text x="20" y="190" class="h" fill="#2e9d6a">v2（修改後）：把檢查往前移到「大綱」</text>
  <rect x="20" y="208" width="130" height="50" rx="10" class="p"/><text x="85" y="239" class="t">查詢 Wiki</text>
  <rect x="195" y="208" width="130" height="50" rx="10" class="n"/><text x="260" y="239" class="t">寫大綱</text>
  <rect x="370" y="208" width="130" height="50" rx="10" class="n"/><text x="435" y="239" class="t">大綱檢查</text>
  <rect x="545" y="208" width="140" height="50" rx="10" class="p"/><text x="615" y="239" class="t">產生 HTML</text>
  <rect x="730" y="208" width="130" height="50" rx="10" class="c"/><text x="795" y="239" class="t">簡報檢查</text>
  <path class="f" d="M150 233 H193"/><path class="f" d="M325 233 H368"/><path class="f" d="M500 233 H543"/><path class="f" d="M685 233 H728"/>
  <text x="880" y="230" font-size="14" fill="#2e9d6a" font-weight="700">✓ 0 錯誤</text>
  <text x="880" y="250" font-size="12.5" fill="#5d6475">一次通過</text>
  <text x="348" y="280" font-size="13" fill="#2e9d6a" text-anchor="middle" font-weight="700">每頁先規劃：用哪些 Wiki 頁、哪些數字、在哪頁介紹哪個術語</text>
</svg>
