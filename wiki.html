var DATA = {"order": ["index", "analogies", "chunking-and-embedding", "contextual-retrieval", "evaluation", "glossary", "history-and-name", "limitations-and-when-not", "llm-limitations", "rag-definition", "rag-paradigms", "rag-pipeline", "rag-vs-finetuning", "retrieval-methods", "use-cases", "S1-lewis-2020", "S2-aws", "S3-ibm", "S4-nvidia", "S5-anthropic", "S6-gao-survey", "S7-microsoft", "00-主題與範圍討論", "01-逐篇ingest討論", "log", "CLAUDE"], "docs": {"index": {"group": "目錄", "md": "---\ntitle: RAG 檢索增強生成 — LLM Wiki 目錄\nupdated: 2026-11-23\n---\n\n# RAG 檢索增強生成 — LLM Wiki\n\n> 這是一個用 LLM 協助建立與維護的個人知識庫，主題是「檢索增強生成（RAG）」。\n> 共 ingest 7 篇有公信力的來源（2 篇學術論文 + 5 篇科技公司官方文件 / 部落格）。\n\n## 🧭 入門（先讀這幾頁）\n| 頁面 | 一句話摘要 |\n|---|---|\n| [[rag-definition]] | RAG 是什麼：先查資料、再根據資料回答 |\n| [[llm-limitations]] | 沒有 RAG 的 LLM 有哪些問題（幻覺、過時、無來源） |\n| [[analogies]] | 開書考、法官與書記官、熱心新員工三個比喻 |\n| [[history-and-name]] | RAG 這個名字怎麼來的 |\n\n## ⚙️ 運作原理\n| 頁面 | 一句話摘要 |\n|---|---|\n| [[rag-pipeline]] | 建索引 → 檢索 → 增強 → 生成，附 Alice 請假例子 |\n| [[chunking-and-embedding]] | 為什麼要切片、什麼是向量嵌入 |\n| [[retrieval-methods]] | 關鍵字 vs 向量 vs 混合搜尋，以及重新排序 |\n| [[contextual-retrieval]] | 片段失去上下文的問題與 Anthropic 的解法 |\n\n## 🚀 進階與比較\n| 頁面 | 一句話摘要 |\n|---|---|\n| [[rag-paradigms]] | Naive / Advanced / Modular RAG 與代理式檢索 |\n| [[rag-vs-finetuning]] | RAG、微調、提示工程怎麼選 |\n| [[evaluation]] | 3 個品質分數 + 4 種能力 |\n| [[limitations-and-when-not]] | RAG 的限制，以及什麼時候不需要 RAG |\n| [[use-cases]] | 人資、客服、醫療、金融等應用 |\n\n## 📖 工具頁\n| 頁面 | 一句話摘要 |\n|---|---|\n| [[glossary]] | 名詞解釋 |\n\n## 📚 來源（raw/）\n| ID | 來源 | 類型 |\n|---|---|---|\n| S1 | Lewis et al. (2020), *Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks*, NeurIPS — https://arxiv.org/abs/2005.11401 | 原始論文 |\n| S2 | AWS, *What is RAG?* — https://aws.amazon.com/what-is/retrieval-augmented-generation/ | 官方說明 |\n| S3 | IBM Research, *What is retrieval-augmented generation (RAG)?* (2023) — https://research.ibm.com/blog/retrieval-augmented-generation-RAG | 研究部落格 |\n| S4 | NVIDIA, *What Is Retrieval-Augmented Generation, aka RAG?* (2023/2025) — https://blogs.nvidia.com/blog/what-is-retrieval-augmented-generation/ | 官方部落格 |\n| S5 | Anthropic, *Introducing Contextual Retrieval* (2024) — https://www.anthropic.com/engineering/contextual-retrieval | 技術文章 |\n| S6 | Gao et al. (2023/2024), *RAG for LLMs: A Survey* — https://arxiv.org/abs/2312.10997 | 綜述論文 |\n| S7 | Microsoft Learn, *RAG in Azure AI Search* (2026 更新) — https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview | 官方文件 |\n\n其他：[[log]]（操作紀錄）\n"}, "analogies": {"group": "Wiki 頁面", "md": "---\ntitle: RAG 的比喻\nsources: [S2, S3, S4]\nupdated: 2026-11-23\n---\n\n# RAG 的比喻（教學用）\n\n## 1. 閉卷考 vs 開書考（IBM）\n- 沒有 RAG：閉卷考，只能靠背下來的東西作答，忘記了就亂寫。\n- 有 RAG：開書考，可以先翻課本找到答案再寫。[S3]\n\n## 2. 法官與書記官（NVIDIA）\n法官靠一般法律知識就能判很多案子；遇到特殊案件時，會請書記官去法律圖書館找判例。RAG 就是 AI 的「書記官」。[S4]\n\n## 3. 過度熱心的新員工（AWS、IBM）\n- AWS：沒有 RAG 的 LLM 像一個很有自信、什麼都回答，但沒跟上最新狀況的新員工。[S2]\n- IBM：像還沒查證就脫口而出的新人。[S3]\n\n## 簡報使用建議（整理）\n- 開場先用「新員工」比喻點出問題 → 再用「開書考」說明 RAG 的解法。\n- 「法官與書記官」適合解釋「LLM 本身還是要負責寫答案，RAG 只是幫它找資料」。\n\n相關：[[rag-definition]]、[[llm-limitations]]\n"}, "chunking-and-embedding": {"group": "Wiki 頁面", "md": "---\ntitle: 切片（Chunking）與向量嵌入（Embedding）\nsources: [S1, S2, S5, S6, S7]\nupdated: 2026-11-23\n---\n\n# 切片與向量嵌入\n\n## 為什麼要切片？\n- LLM 能接收的輸入長度（tokens）有限，不能把所有文件都塞進去。[S7]\n- 所以要把大文件切成小片段（chunk），每個片段可以單獨被比對、被找到。[S7]\n- 片段通常不超過幾百個 tokens。[S5]\n- 例：RAG 原始論文把 Wikipedia 每篇文章切成 100 字的片段。[S1]\n\n## 什麼是向量嵌入（embedding）？\n- embedding 模型把一段文字轉成一串數字（向量）。[S2]\n- 意思相近的文字，向量也會比較接近，所以可以用「距離」找出和問題意思最接近的片段。（整理，依 [S2][S6] 的「相似度檢索」）\n- 問題和片段必須用**同一個** embedding 模型轉換，才能互相比較。[S6]\n- 轉好的向量存放在**向量資料庫**裡。[S2][S5]\n\n## 切片的副作用：失去上下文\n片段切出來之後，可能看不出原本在講什麼。例：「公司營收比上一季成長 3%」—— 哪家公司？哪一季？[S5]\n→ 解法見 [[contextual-retrieval]]\n\n相關：[[rag-pipeline]]、[[retrieval-methods]]\n"}, "contextual-retrieval": {"group": "Wiki 頁面", "md": "---\ntitle: 情境式檢索（Contextual Retrieval）\nsources: [S5]\nupdated: 2026-11-23\n---\n\n# 情境式檢索（Contextual Retrieval）\n\n## 要解決的問題\n片段被切出來後失去上下文。例：使用者問「ACME 公司 2023 年 Q2 營收成長多少？」，但相關片段只寫「公司營收比上一季成長 3%」，系統不知道這段是在講 ACME。[S5]\n\n## 做法\n1. 讓 LLM 讀整份文件和某個片段，替片段寫一小段說明（通常 50–100 tokens）。[S5]\n   - 例：「這段出自 ACME 公司 2023 年 Q2 財報…」[S5]\n2. 把說明加在片段前面，再做 embedding（Contextual Embeddings）和 BM25 索引（Contextual BM25）。[S5]\n\n## 效果（前 20 個片段的檢索失敗率）[S5]\n| 做法 | 失敗率 | 降幅 |\n|---|---|---|\n| 一般做法 | 5.7% | — [S5] |\n| + Contextual Embeddings | 3.7% | 降低 35% [S5] |\n| + Contextual BM25 | 2.9% | 降低 49% [S5] |\n| + Reranking | 1.9% | 降低 67% [S5] |\n\n⚠ 注意：35% / 49% / 67% 是「失敗率下降的比例」，**不是**準確率。[S5]\n\n## 學到的事（整理）\nRAG 的品質很大一部分取決於「找得準不準」，而不只是 LLM 本身強不強。\n\n相關：[[retrieval-methods]]、[[chunking-and-embedding]]\n"}, "evaluation": {"group": "Wiki 頁面", "md": "---\ntitle: 怎麼評估 RAG 做得好不好？\nsources: [S5, S6]\nupdated: 2026-11-23\n---\n\n# 怎麼評估 RAG？（Gao 綜述，PDF 逐字確認 ✅）\n\n## 3 個品質分數 [S6]\n| 名稱 | 問的問題 |\n|---|---|\n| 上下文相關性 Context Relevance | 找到的資料跟問題有關嗎？ |\n| 答案忠實度 Answer Faithfulness | 答案有沒有忠於找到的資料、不自己亂編？ |\n| 答案相關性 Answer Relevance | 答案有沒有直接回答問題？ |\n\n## 4 種能力 [S6]\n| 能力 | 意思 |\n|---|---|\n| 抗雜訊 Noise Robustness | 遇到看似相關但沒有實質內容的文件，還能答對 |\n| 拒答 Negative Rejection | 資料裡沒有答案時，不要硬答 |\n| 資訊整合 Information Integration | 能整合多份文件回答複雜問題 |\n| 反事實穩健性 Counterfactual Robustness | 文件中有錯誤資訊時，能辨認並忽略 |\n\n- 這些評估指標目前還沒有成熟、統一的標準。[S6]\n- 實務建議：用自己的資料做評估測試，再決定設定。[S5]\n\n## 跟我的 Wiki 有什麼關係？（整理）\n「答案忠實度」正好就是我在簡報檢查節點做的事：簡報每一頁的內容，都要能在 Wiki 裡找到依據。\n\n相關：[[rag-paradigms]]、[[limitations-and-when-not]]\n"}, "glossary": {"group": "Wiki 頁面", "md": "---\ntitle: 名詞解釋\nsources: [S1, S2, S5, S6, S7]\nupdated: 2026-11-23\n---\n\n# 名詞解釋\n\n| 名詞 | 白話解釋 | 來源 |\n|---|---|---|\n| LLM 大型語言模型 | 用大量文字訓練、能生成文字的 AI 模型 | [S2] |\n| 幻覺 Hallucination | 模型產生看似合理但錯誤的內容 | [S1] |\n| RAG 檢索增強生成 | 先查資料、再根據資料回答 | [S2] |\n| 參數記憶 | 存在模型權重裡的知識 | [S1] |\n| 非參數記憶 | 存在外部資料庫裡的知識 | [S1] |\n| Token | 模型處理文字的基本單位 | [S5][S7] |\n| 片段 Chunk | 把長文件切成的小段落 | [S5][S7] |\n| 向量嵌入 Embedding | 把文字轉成一串數字，意思相近的數字也相近 | [S2][S6] |\n| 向量資料庫 | 存放向量、可快速找出相似向量的資料庫 | [S2] |\n| BM25 | 一種關鍵字比對的排序方法 | [S5] |\n| 混合搜尋 Hybrid search | 關鍵字搜尋 + 向量搜尋一起用 | [S7] |\n| 重新排序 Reranking | 先多撈一些，再精挑最相關的 | [S5] |\n| Top-K | 取最相關的前 K 筆結果 | [S6] |\n| 微調 Fine-tuning | 用新資料再訓練模型 | [S6] |\n| 代理式檢索 Agentic retrieval | 讓 LLM 把問題拆成多個子查詢再去找 | [S7] |\n\n相關：[[rag-definition]]\n"}, "history-and-name": {"group": "Wiki 頁面", "md": "---\ntitle: RAG 的由來與名稱\nsources: [S1, S4, S6]\nupdated: 2026-11-23\n---\n\n# RAG 的由來與名稱\n\n- 「RAG」這個詞來自 2020 年的論文〈Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks〉，第一作者是 Patrick Lewis，發表在 NeurIPS 2020。[S1][S4]\n- 作者群來自 Facebook AI Research、倫敦大學學院（UCL）、紐約大學（NYU）。[S1][S4]\n- Patrick Lewis 曾為這個不太好聽的縮寫道歉，說如果早知道會這麼普及，會多花點心思取名。[S4]\n- 之後研究快速發展，2023 年的綜述論文把 RAG 分成 Naive、Advanced、Modular 三種典範。[S6] 見 [[rag-paradigms]]\n\n相關：[[rag-definition]]\n"}, "limitations-and-when-not": {"group": "Wiki 頁面", "md": "---\ntitle: RAG 的限制，以及什麼時候不需要 RAG\nsources: [S1, S3, S5, S6]\nupdated: 2026-11-23\n---\n\n# RAG 的限制 & 什麼時候不需要\n\n## RAG 不是萬靈丹\n1. **找錯資料，就會答錯**：檢索可能找不準或找不全。[S6] IBM 也承認 RAG 並不完美，檢索和生成都還在改進。[S3]\n2. **還是可能有幻覺**：即使有資料，生成時仍可能產生沒有根據的內容。[S6]\n3. **模型不知道自己不知道**：需要特別訓練，模型才會辨認出「這題我答不出來」。[S3]\n4. **延遲較高**：多了一個檢索步驟。[S6]\n\n## RAG 的強項：換資料就能更新知識\nRAG 原始論文的實驗：[S1]\n- 準備 82 位在 2016 到 2018 年間換人的世界領袖，問「誰是某某職位？」[S1]\n- 用 2016 年索引問 2016 年領袖：答對 70%；用 2018 年索引問 2018 年領袖：答對 68%。[S1]\n- 索引年份不對時：只答對 12% 和 4%。[S1]\n- 結論：不用重新訓練，換掉知識庫就能更新模型的知識。\n\n## 什麼時候不需要 RAG？\n- 知識庫小於 20 萬 tokens（約 500 頁）時，可以直接把整個知識庫放進提示，不一定需要 RAG。[S5]\n- 只是想改變模型的說話風格 → 微調或提示工程可能更適合。[S6] 見 [[rag-vs-finetuning]]\n\n相關：[[evaluation]]、[[llm-limitations]]\n"}, "llm-limitations": {"group": "Wiki 頁面", "md": "---\ntitle: 沒有 RAG 的 LLM 有什麼問題？\nsources: [S1, S2, S3, S4, S7]\nupdated: 2026-11-23\n---\n\n# 沒有 RAG 的 LLM 有什麼問題？\n\n## 1. 知識有截止日\n訓練資料是靜態的，模型只知道訓練當時的資訊，之後發生的事它不知道。[S2]\n\n## 2. 會「一本正經地胡說八道」（幻覺 hallucination）\n- 只靠模型權重記憶知識的模型，可能產生看似合理但錯誤的內容。[S1]\n- AWS 列出 LLM 的 4 個常見問題：[S2]\n  1. 不知道答案時給出錯誤資訊\n  2. 給出過時或籠統的資訊\n  3. 根據不具權威性的來源回答\n  4. 術語混淆（同一個詞在不同地方意思不同）\n- IBM 的例子：問產假可以請多久，沒有 RAG 的聊天機器人回答「想請多久就請多久」—— 這是錯的，因為各地規定不同。[S3]\n\n## 3. 說不出答案從哪來\n只靠參數記憶的模型，很難說明它的答案依據什麼。[S1]\n\n## 4. 不知道你公司的內部資料\nLLM 沒看過公司內部文件（例如人事規章、產品手冊），自然回答不出來。（整理，根據 [S2][S3] 的企業情境）\n\n## 5. 要更新知識很貴\n只靠參數的模型，要更新知識就得再訓練。[S1] 持續重新訓練的運算與金錢成本很高。[S3]\n\n## RAG 怎麼對應這些問題（整理）\n| 問題 | RAG 的對策 |\n|---|---|\n| 知識過時 | 查最新的外部資料 [S2] |\n| 幻覺 | 根據找到的資料回答，降低幻覺 [S3][S4] |\n| 說不出來源 | 可以附上出處讓人查證 [S2][S4] |\n| 不懂內部資料 | 把內部文件放進知識庫 [S7] |\n| 更新很貴 | 換資料不用重新訓練 [S1][S2] |\n\n相關：[[rag-definition]]、[[limitations-and-when-not]]\n"}, "rag-definition": {"group": "Wiki 頁面", "md": "---\ntitle: RAG 是什麼？\nsources: [S1, S2, S3, S4, S7]\nupdated: 2026-11-23\n---\n\n# RAG 是什麼？\n\n**檢索增強生成（Retrieval-Augmented Generation，RAG）**：讓大型語言模型（LLM）在回答之前，**先去外部資料找相關內容，再根據找到的內容來回答**。\n\n## 各來源的定義（互相印證）\n- AWS：在生成回答前，讓 LLM 先參考「訓練資料以外的權威知識庫」，而且不需要重新訓練模型。[S2]\n- IBM：從外部知識庫取得事實，讓 LLM 的回答有根據（grounding），也讓使用者看得到依據。[S3]\n- NVIDIA：用從特定、相關的資料來源取得的資訊，提升生成式 AI 的準確度與可靠度。[S4]\n- Microsoft：把 LLM 的回答建立在你自己的專有內容上的一種模式。[S7]\n\n## 原始論文的說法：兩種記憶\nRAG 原始論文把系統拆成兩種「記憶」[S1]：\n| | 參數記憶（parametric） | 非參數記憶（non-parametric） |\n|---|---|---|\n| 是什麼 | 模型權重裡學到的知識 | 外部資料庫（論文用 Wikipedia 索引） |\n| 論文中的元件 | BART 生成模型 | DPR 檢索器 + 向量索引 |\n| 要更新知識 | 需要重新訓練 | 換掉資料庫就好 |\n\n論文用的知識庫：2018 年 12 月的 Wikipedia，切成 100 字的片段，共 2100 萬（21M）份文件。[S1]\n\n## 一句話記住（整理）\n> LLM 是「會寫作的人」，RAG 幫它配了一個「會找資料的助理」。\n\n## 相關頁面\n- 為什麼需要 RAG → [[llm-limitations]]\n- 怎麼運作 → [[rag-pipeline]]\n- 名稱由來 → [[history-and-name]]\n- 比喻 → [[analogies]]\n"}, "rag-paradigms": {"group": "Wiki 頁面", "md": "---\ntitle: RAG 的三代演進\nsources: [S6, S7]\nupdated: 2026-11-23\n---\n\n# RAG 的三代演進（Gao 綜述）\n\n| 典範 | 特徵 | 比喻（整理） |\n|---|---|---|\n| Naive RAG（樸素） | 索引 → 檢索 → 生成，一條直線，又稱 Retrieve-Read [S6] | 查一次字典就作答 |\n| Advanced RAG（進階） | 在檢索前（改寫問題、優化索引）與檢索後（重新排序、壓縮）加優化 [S6] | 先想好要查什麼，查完再挑重點 |\n| Modular RAG（模組化） | 加入搜尋、記憶、路由等模組，流程可重組，可反覆檢索 [S6] | 像樂高，可以依任務組裝 |\n\n## Naive RAG 的三類缺點 [S6]\n1. **檢索**：找不準（不相關）或找不全（漏掉）。\n2. **生成**：還是可能產生沒有根據的內容。\n3. **增強**：多個來源整合不順、重複；只查一次不夠回答複雜問題。\n\n## 最新發展：代理式檢索（Agentic Retrieval）\n用 LLM 先做「查詢規劃」，把複雜問題拆成多個子問題，平行到不同來源查，再合併結果。Microsoft 建議新專案優先採用，簡單需求可用傳統 RAG。[S7]\n\n相關：[[rag-pipeline]]、[[retrieval-methods]]、[[evaluation]]\n"}, "rag-pipeline": {"group": "Wiki 頁面", "md": "---\ntitle: RAG 怎麼運作？（流程）\nsources: [S2, S3, S4, S6]\nupdated: 2026-11-23\n---\n\n# RAG 怎麼運作？\n\n## 統一後的四步驟（整理自 S2、S3、S4、S6）\n\n| 步驟 | 做什麼 | 來源 |\n|---|---|---|\n| ① 建索引 | 把文件清理、切成片段，用 embedding 模型轉成向量，存進向量資料庫 | [S2][S6] |\n| ② 檢索 | 把使用者的問題也轉成向量，找出最相似的前 K 個片段 | [S2][S4][S6] |\n| ③ 增強 | 把找到的片段和問題一起組成新的提示（prompt） | [S2][S3][S6] |\n| ④ 生成 | LLM 根據增強後的提示寫出答案，可附上來源 | [S3][S4] |\n\n補充：資料會變，所以要定期或即時更新文件與向量（AWS 把這當成第 4 步）。[S2]\n\n> 為什麼不同來源步驟數不一樣？AWS 是「建立資料 → 檢索 → 增強提示 → 更新資料」[S2]；Gao 綜述是「索引 → 檢索 → 生成」三步 [S6]；IBM 是「檢索、生成」兩階段 [S3]。切法不同，但核心都是「先找再寫」。（整理）\n\n## 兩個階段的觀點（IBM）\n1. 檢索階段：找出和問題相關的資料片段。\n2. 生成階段：把片段附加到提示中，讓 LLM 寫答案。[S3]\n\n## 完整例子：Alice 請半天假（IBM）\n1. Alice 問：「我可以請半天假嗎？今年假還夠嗎？」\n2. 檢索：系統查 Alice 的人事資料（剩幾天假）＋公司請假規定（能不能請半天）。\n3. 增強：把這兩份資料和 Alice 的問題放進提示。\n4. 生成：LLM 回答 Alice 能不能請、剩幾天，並附上規定的來源連結。[S3]\n\n相關：[[chunking-and-embedding]]、[[retrieval-methods]]、[[rag-paradigms]]\n"}, "rag-vs-finetuning": {"group": "Wiki 頁面", "md": "---\ntitle: RAG vs 微調 vs 提示工程\nsources: [S1, S2, S4, S6]\nupdated: 2026-11-23\n---\n\n# RAG vs 微調（Fine-tuning）vs 提示工程（Prompt Engineering）\n\n| | 提示工程 | RAG | 微調 |\n|---|---|---|---|\n| 做法 | 改寫給模型的指令 | 回答前先查外部資料 | 用新資料再訓練模型 |\n| 需要外部知識？ | 最少 [S6] | 需要（知識庫）[S6] | 需要（訓練資料）[S6] |\n| 知識更新 | — | 換資料即可，可即時更新 [S6] | 靜態，要重新訓練 [S6] |\n| 可解釋 / 附來源 | 否 | 可以 [S6] | 否 |\n| 強項 | 最簡單 | 精確、最新、可查證 [S6] | 改變模型的行為與風格 [S6] |\n| 弱點 | 能力有限 | 延遲較高 [S6] | 成本高、更新慢 |\n\n## 重點\n- RAG 比用更多資料重新訓練模型更快、更便宜。[S4]\n- 不需要重新訓練模型，就能讓 LLM 用上特定領域或內部知識。[S2]\n- RAG 原始論文實驗：只換知識庫（2016 年 vs 2018 年的 Wikipedia），就能讓模型答對不同年份的世界領袖。[S1] 詳見 [[limitations-and-when-not]]\n- **RAG 和微調不互斥**，可以一起用、互相補強。[S6]\n\n## 怎麼選？（整理）\n- 要「知道新知識、查得到出處」→ RAG\n- 要「改變說話方式、格式、專業風格」→ 微調\n- 先試試看提示工程能不能解決 → 最便宜\n\n相關：[[rag-definition]]、[[llm-limitations]]\n"}, "retrieval-methods": {"group": "Wiki 頁面", "md": "---\ntitle: 怎麼「找」資料？檢索方法\nsources: [S2, S5, S6, S7]\nupdated: 2026-11-23\n---\n\n# 檢索方法比較\n\n| 方法 | 原理 | 擅長 | 不擅長 | 來源 |\n|---|---|---|---|---|\n| 關鍵字搜尋（如 BM25） | 比對完全相同的字詞 | 錯誤代碼、專有名詞、編號 | 換句話說就找不到 | [S5][S7] |\n| 向量搜尋 | 比對 embedding 的相似度（意思接近） | 換句話說、同義詞 | 精確的代碼或編號 | [S2][S5][S7] |\n| 混合搜尋（hybrid） | 兩種同時查，再合併結果 | 兼顧兩者，提高召回率 | 較複雜 | [S5][S7] |\n\n## 例子：錯誤代碼\n查「Error code TS-999」時，語意（向量）搜尋可能找不到完全相同的那筆，BM25 關鍵字搜尋可以。[S5]\n\n## 重新排序（Reranking）\n1. 先撈比較多的候選片段（Anthropic 的實驗用 150 個）。[S5]\n2. 再用排序模型重新評分，只留最相關的（實驗用 20 個）。[S5]\n3. 代價：增加一點延遲與成本。[S5]\n- Microsoft 的做法叫「語意排序（semantic ranking）」，依意思重新排序結果。[S7]\n- Gao 綜述把 rerank 歸類為「檢索後」的優化。[S6]\n\n## 讓檢索更好的小技巧\n- 混合搜尋提高召回、語意排序提高相關性；限制回傳筆數與最低分數門檻。[S7]\n- 改寫或擴充使用者的問題（檢索前優化）。[S6]\n\n相關：[[chunking-and-embedding]]、[[contextual-retrieval]]、[[rag-paradigms]]\n"}, "use-cases": {"group": "Wiki 頁面", "md": "---\ntitle: RAG 的應用場景\nsources: [S3, S4, S7]\nupdated: 2026-11-23\n---\n\n# RAG 的應用場景\n\n| 場景 | 例子 | 來源 |\n|---|---|---|\n| 人資問答 | Alice 問能不能請半天假，系統查人事資料與請假規定 | [S3] |\n| 企業客服 | IBM 用 RAG 讓內部客服聊天機器人根據可查證的內容回答 | [S3] |\n| 醫療 | 連到醫學索引的助理，給醫師與護理師使用 | [S4] |\n| 金融 | 連到市場資料的金融分析助理 | [S4] |\n| 員工訓練 / 技術支援 | 把手冊、影片、紀錄檔變成知識庫 | [S4] |\n| 企業內部知識 | 資料分散在 SharePoint、資料庫、雲端，並且要依權限控管誰能查到什麼 | [S7] |\n\n## 共通點（整理）\n需要「**最新**」、「**專屬**」、「**能查證**」資訊的地方，就適合用 RAG。\n\n相關：[[rag-pipeline]]、[[rag-definition]]\n"}, "S1-lewis-2020": {"group": "原始來源 raw", "md": "---\nid: S1\ntitle: \"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\"\nauthors: Patrick Lewis, Ethan Perez, Aleksandra Piktus, Fabio Petroni, Vladimir Karpukhin, Naman Goyal, Heinrich Küttler, Mike Lewis, Wen-tau Yih, Tim Rocktäschel, Sebastian Riedel, Douwe Kiela\norg: Facebook AI Research、University College London、New York University\nvenue: NeurIPS 2020\nurl: https://arxiv.org/abs/2005.11401\ndates: v1 2020-05-22，v4 2021-04-12\naccessed: 2026-11-23\ntype: 學術論文（原始論文）\n---\n\n# S1 擷取筆記：Lewis et al. (2020)\n\n## 讀取紀錄\n- 第 1 次：arXiv HTML 版 → 只讀到前約 4 萬字元，後半為 AI 摘要（⚠ 不可直接採用）。PDF 回傳為二進位。\n- 第 2 次：改用 PDF 抽文字（PyMuPDF），逐字核對第 4.5 節 → ✅\n\n## 重點（改寫成中文，非原文照抄）\n1. **要解決的問題**：只靠參數（模型權重）儲存知識的模型，很難擴充或修改記憶，也無法說明答案從哪來，還可能產生「幻覺」。\n2. **RAG 的定義**：結合兩種記憶 —\n   - 參數記憶（parametric memory）：預訓練的 seq2seq 生成模型（BART）。\n   - 非參數記憶（non-parametric memory）：Wikipedia 的稠密向量索引，用 DPR 檢索器來查。\n3. **知識庫規模** ✅：使用 2018 年 12 月的 Wikipedia，每篇文章切成不重疊的 100 字片段，共 2100 萬（21M）份文件。\n4. **兩種版本**：\n   - RAG-Sequence：整段答案都根據同一份檢索到的文件。\n   - RAG-Token：每個字都可以參考不同文件。\n5. **結果**：在三個開放領域問答資料集（Natural Questions、WebQuestions、CuratedTrec）達到當時最佳；人工評估顯示 RAG 產生的內容比純 BART 更符合事實、更具體。\n   - 人工評估（Jeopardy 出題任務）✅：認為 RAG 較符合事實的比例 42.7%，認為 BART 較好的只有 7.1%。\n6. **換索引就能更新知識（Index hot-swapping）** ✅：\n   - 作者用 2016 年 12 月和 2018 年 12 月兩個版本的 Wikipedia 索引，準備 82 位在這段期間換人的世界領袖，問「誰是某某職位？」\n   - 索引與年份相符：答對 70%（2016）、68%（2018）。\n   - 索引與年份不符：只答對 12% 與 4%。\n   - 作者結論：只要換掉非參數記憶，就能更新 RAG 的世界知識，不必重新訓練。\n"}, "S2-aws": {"group": "原始來源 raw", "md": "---\nid: S2\ntitle: \"What is RAG (Retrieval-Augmented Generation)?\"\norg: Amazon Web Services (AWS)\nurl: https://aws.amazon.com/what-is/retrieval-augmented-generation/\ndates: 頁面未標示日期（版權年 2026）\naccessed: 2026-11-23\ntype: 雲端廠商官方說明\n---\n\n# S2 擷取筆記：AWS — What is RAG?\n\n## 讀取紀錄\n- 一次讀取完整，未截斷 ✅\n\n## 重點\n1. **定義**：RAG 是優化 LLM 輸出的過程，讓模型在生成回答之前，先參考「訓練資料以外的權威知識庫」。不需要重新訓練模型，是成本較低的做法。\n2. **沒有 RAG 時 LLM 的 4 個問題** ✅：\n   1. 不知道答案時給出錯誤資訊。\n   2. 使用者需要最新、具體的答案時，給出過時或籠統的資訊。\n   3. 根據不具權威性的來源產生回答。\n   4. 不同訓練資料用同一個詞指不同東西，造成術語混淆而答錯。\n3. 訓練資料是靜態的，所以 LLM 有「知識截止日」。\n4. **比喻**：沒有 RAG 的 LLM 像一個「過度熱心的新員工」，什麼都很有自信地回答，但沒有跟上最新狀況。\n5. **4 個好處** ✅：成本效益高、資訊即時、提升使用者信任（可附來源與引用）、開發者掌控度更高（可更換來源、依權限限制檢索、方便除錯）。\n6. **運作 4 步驟** ✅：\n   1. 建立外部資料：把 API、資料庫、文件等資料用 embedding 模型轉成數字（向量），存進向量資料庫。\n   2. 檢索相關資訊：把使用者的問題也轉成向量，到向量資料庫做相關性搜尋。\n   3. 增強 LLM 提示：把找到的資料加進使用者的提示中。\n   4. 更新外部資料：定期或即時更新文件與向量，讓資料保持最新。\n7. **與語意搜尋的關係**：語意搜尋可以提升 RAG 的結果；傳統關鍵字搜尋在知識密集任務上效果有限。\n"}, "S3-ibm": {"group": "原始來源 raw", "md": "---\nid: S3\ntitle: \"What is retrieval-augmented generation (RAG)?\"\nauthor: Kim Martineau\norg: IBM Research\nurl: https://research.ibm.com/blog/retrieval-augmented-generation-RAG\ndates: 2023-08-22\naccessed: 2026-11-23\ntype: 研究機構官方部落格\n---\n\n# S3 擷取筆記：IBM Research Blog\n\n## 讀取紀錄\n- 一次讀取完整，未截斷 ✅\n\n## 重點\n1. **定義**：RAG 是一種 AI 框架，從外部知識庫取得事實，讓 LLM 的回答有「根據」（grounding），也讓使用者看得到生成過程依據了什麼。\n2. **比喻**：\n   - 開書考 vs 閉卷考：RAG 讓模型「翻書找答案」，而不是靠記憶硬背。（IBM 研究員 Luis Lastras 的說法）\n   - 沒有 RAG 的模型像「還沒查證就脫口而出的新人」。\n3. **兩個階段**：\n   1. 檢索（retrieval）：演算法搜尋並取出和問題相關的資料片段。企業內部通常只用少數可信來源，以兼顧安全與可靠。\n   2. 生成（content generation）：把片段附加到使用者的提示中，LLM 根據「增強後的提示」加上自己的訓練知識來寫答案，可附上來源連結。\n4. **好處**：取得最新可靠的資訊；可引用來源讓使用者查證；降低幻覺；減少模型洩漏訓練資料中敏感資訊的機會；減少持續重新訓練的成本。\n5. **例子**：\n   - **Alice 請假**：員工 Alice 問「可以請半天假嗎？今年假還夠嗎？」系統先查她的人事資料（剩幾天假）和公司請假規定（能否請半天），再讓 LLM 產生個人化的回答並附上來源。\n   - **產假反例**：各國各州規定不同，沒有 RAG 的聊天機器人曾經愉快地回答「想請多久就請多久」，這是錯的；正確做法是說不知道或追問。\n6. **限制**：\n   - 模型不知道自己不知道，需要特別訓練才能辨認「答不出來的問題」。\n   - RAG 並不完美，檢索（找到最相關的資料）和生成（怎麼把資料組織給 LLM）都還在研究改進中。\n"}, "S4-nvidia": {"group": "原始來源 raw", "md": "---\nid: S4\ntitle: \"What Is Retrieval-Augmented Generation, aka RAG?\"\nauthor: Rick Merritt\norg: NVIDIA\nurl: https://blogs.nvidia.com/blog/what-is-retrieval-augmented-generation/\ndates: 原文 2023-11-15，更新 2025-01-31\naccessed: 2026-11-23\ntype: 業界官方部落格\n---\n\n# S4 擷取筆記：NVIDIA Blog\n\n## 讀取紀錄\n- 一次讀取完整 ✅；頁面側欄的其他新聞不納入。\n\n## 重點\n1. **定義**：RAG 是一種技術，用從特定、相關資料來源取得的資訊，提升生成式 AI 的準確度與可靠度。\n2. **比喻：法官與書記官**：法官憑一般法律知識就能判很多案子；遇到特殊案件，會派書記官到法律圖書館找判例。RAG 就像 AI 的「書記官」。\n3. **名稱由來**：「RAG」一詞來自 Patrick Lewis 擔任第一作者的 2020 年論文（共同作者來自 Facebook AI Research、倫敦大學學院、紐約大學）。Lewis 曾為這個不太好聽的縮寫道歉，說如果早知道會被這麼廣泛使用，會多花心思取名。\n4. **運作方式**：\n   1. embedding 模型把使用者問題轉成向量。\n   2. 和知識庫的索引（存在向量資料庫）比對。\n   3. 找到相關資料後取出、轉回文字，交給 LLM。\n   4. LLM 把取得的資料和自己的知識結合成最終回答，並可附上來源。\n5. **好處**：可以像論文註腳一樣引用來源，讓使用者自行查證；減少幻覺；比用更多資料重新訓練模型更快、更便宜；可以隨時抽換資料來源。\n6. **應用例子**：醫療索引助理（給醫師護理師）、連結市場資料的金融分析助理、客服、員工訓練、開發者生產力；手冊、影片、紀錄檔都可以變成知識庫。\n"}, "S5-anthropic": {"group": "原始來源 raw", "md": "---\nid: S5\ntitle: \"Introducing Contextual Retrieval\"\norg: Anthropic\nurl: https://www.anthropic.com/engineering/contextual-retrieval\ndates: 2024-09-19\naccessed: 2026-11-23\ntype: AI 公司技術文章\n---\n\n# S5 擷取筆記：Anthropic — Contextual Retrieval\n\n## 讀取紀錄\n- 一次讀取完整 ✅（/news/ 網址會導向 /engineering/）\n\n## 重點\n1. **一般 RAG 的做法**：\n   - 把知識庫切成片段（chunk），通常不超過幾百個 tokens。\n   - 用 embedding 模型把片段轉成向量，存進向量資料庫，做語意搜尋。\n   - 另外用 BM25（關鍵字比對的排序方法）找「完全相同的字」，適合錯誤代碼、專有名詞。例：查「Error code TS-999」，語意搜尋可能找不到，BM25 可以。\n   - 兩種結果合併、去重複，取前 K 個片段放進提示。\n2. **上下文問題**：片段被切出來後會失去上下文。例：問 ACME 公司 2023 年 Q2 營收，但片段只寫「公司營收比上一季成長 3%」，看不出是哪家公司、哪一季。\n3. **Contextual Retrieval（情境式檢索）**：先讓 LLM 為每個片段寫一小段說明（通常 50–100 tokens，例如「這段出自 ACME 公司 2023 年 Q2 財報」），加在片段前面，再做 embedding（Contextual Embeddings）和 BM25 索引（Contextual BM25）。\n4. **實驗結果**（前 20 個片段的「檢索失敗率」降幅）✅：\n   - 只用 Contextual Embeddings：失敗率降低 35%（5.7% → 3.7%）\n   - Contextual Embeddings + Contextual BM25：降低 49%（5.7% → 2.9%）\n   - 再加上重新排序（reranking）：降低 67%（5.7% → 1.9%）\n5. **重新排序（reranking）**：先撈比較多的候選片段（文章用 150 個），再用排序模型評分，只留最相關的 20 個。會增加一點延遲與成本。\n6. **小知識庫不需要 RAG** ✅：知識庫小於 20 萬 tokens（約 500 頁）時，可以直接把整個知識庫放進提示。\n7. 作者建議：用自己的資料做評估測試，再決定設定。\n"}, "S6-gao-survey": {"group": "原始來源 raw", "md": "---\nid: S6\ntitle: \"Retrieval-Augmented Generation for Large Language Models: A Survey\"\nauthors: Yunfan Gao, Yun Xiong, Xinyu Gao, Kangxiang Jia, Jinliu Pan, Yuxi Bi, Yi Dai, Jiawei Sun, Meng Wang, Haofen Wang\norg: 同濟大學、復旦大學\nurl: https://arxiv.org/abs/2312.10997\ndates: v1 2023-12-18，v5 2024-03-27\naccessed: 2026-11-23\ntype: 學術綜述論文\n---\n\n# S6 擷取筆記：Gao et al. RAG Survey\n\n## 讀取紀錄\n- 第 1 次：arXiv HTML 版只讀到前約 30%（到第三章），評估章節來自 AI 摘要（⚠ 不可直接採用）。\n- 第 2 次：改用 PDF 抽文字（PyMuPDF），逐字核對第七章 C 節 Evaluation Aspects → ✅\n\n## 重點\n1. **三種 RAG 典範**：\n   - **Naive RAG（樸素 RAG）**：最早的形式，「索引 → 檢索 → 生成」，又稱 Retrieve-Read。\n   - **Advanced RAG（進階 RAG）**：在檢索前、後加入優化策略，提高檢索品質。\n   - **Modular RAG（模組化 RAG）**：加入新模組（搜尋、記憶、路由等），流程可以重組，例如反覆檢索、視情況才檢索。\n2. **Naive RAG 流程**：\n   - 索引：清理資料 → 切成片段 → 轉成向量 → 存進向量資料庫。\n   - 檢索：用同一個 embedding 模型把問題轉成向量，取最相似的前 K 個片段。\n   - 生成：把問題和片段組成提示，交給 LLM 回答。\n3. **Naive RAG 的三類缺點**：\n   - 檢索：精確度與召回率不足，找到不相關的片段或漏掉重要資訊。\n   - 生成：仍可能產生沒有根據的內容（幻覺），或答非所問、有偏見。\n   - 增強：多個來源的資訊整合不順、重複；只檢索一次可能不夠回答複雜問題。\n4. **Advanced RAG 的優化**：\n   - 檢索前：改善索引（較細的切法、加 metadata）、改寫或擴充使用者問題。\n   - 檢索後：重新排序（rerank）、壓縮上下文，避免資訊過載。\n5. **RAG vs 微調 vs 提示工程**：\n   - 提示工程：最不需要外部知識，也不用改模型。\n   - RAG：適合需要精確、可即時更新、可解釋來源的情境，但延遲較高。\n   - 微調：可深度客製模型的行為與風格，但知識是靜態的，更新要重新訓練。\n   - RAG 與微調「不互斥」，可以互補、一起用。\n6. **評估：3 個品質分數** ✅：\n   - 上下文相關性（Context Relevance）：檢索到的內容是否精確、相關。\n   - 答案忠實度（Answer Faithfulness）：答案是否忠於檢索到的內容、沒有矛盾。\n   - 答案相關性（Answer Relevance）：答案是否直接回應問題。\n7. **評估：4 種能力** ✅：\n   - 抗雜訊（Noise Robustness）：遇到「看似相關但沒有實質內容」的文件時能否處理。\n   - 拒答能力（Negative Rejection）：資料裡沒有答案時，能否不亂回答。\n   - 資訊整合（Information Integration）：能否整合多份文件回答複雜問題。\n   - 反事實穩健性（Counterfactual Robustness）：文件裡有錯誤資訊時，能否辨認並忽略。\n8. 論文指出這些評估指標還沒有成熟、統一的標準。\n"}, "S7-microsoft": {"group": "原始來源 raw", "md": "---\nid: S7\ntitle: \"RAG and Generative AI - Foundry IQ (Azure AI Search)\"\norg: Microsoft Learn\nurl: https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview\ndates: 最後更新 2026-11-17\naccessed: 2026-11-23\ntype: 官方技術文件\n---\n\n# S7 擷取筆記：Microsoft Learn — RAG in Azure AI Search\n\n## 讀取紀錄\n- 一次讀取完整 ✅。注意：頁面標題已改名為「Foundry IQ」，網址仍是 retrieval-augmented-generation-overview。\n\n## 重點\n1. **定義**：RAG 是一種模式（pattern），把 LLM 的回答建立在「你自己的專有內容」上，以擴充 LLM 的能力。\n2. **企業為什麼用**：資料分散在多個地方（SharePoint、資料庫、雲端儲存）；私有資料需要權限控管（例如只讓有權限的人查到特定文件）。\n3. **為什麼要切片**：LLM 能接收的輸入長度（tokens）有限，所以要把大文件切成小片段，讓每個片段可以被單獨比對。\n4. **搜尋方式**：\n   - 關鍵字 / 全文搜尋。\n   - 向量搜尋：比對 embedding 的相似度。\n   - 混合搜尋（hybrid）：關鍵字和向量同時查，合併結果，提高召回率。\n   - 語意排序（semantic ranking）：依「意思」對結果重新評分排序。\n5. **提高檢索品質的方法**：混合搜尋提高召回、語意排序提高相關性；限制回傳筆數（top-k）與最低分數門檻；只回傳需要的欄位。\n6. **代理式檢索（agentic retrieval）**：用 LLM 做「查詢規劃」，把一個複雜問題拆成多個子查詢，平行到不同來源查，再合併結果。Microsoft 建議新專案優先採用；簡單需求可用傳統 RAG。\n"}, "00-主題與範圍討論": {"group": "討論紀錄", "md": "# 討論 00：主題與範圍（還沒生成任何頁面之前）\n\n日期：2026-11-23\n\n## Q1. 為什麼選 RAG？\n- 這學期上課講過 LLM 是「猜下一個字」、會有幻覺（hallucination），也有知識截止日期。RAG 正好是業界用來處理這兩個問題最常見的做法，跟課程內容銜接得起來。\n- RAG 有原始論文（2020）和綜述論文，也有 AWS / IBM / NVIDIA / Microsoft 等大公司的官方說明，**找得到有公信力的來源**。\n- 很巧的是，「LLM Wiki」本身也是一種讓 AI 讀資料再回答的方法，做完可以順便比較兩者。\n\n## Q2. 簡報要給誰看？\n- 目標聽眾：**沒學過 AI 技術的大學生**（例如其他系的同學）。\n- 所以要：少公式、多比喻、每個技術名詞第一次出現時都要解釋、要有一個從頭走到尾的例子。\n\n## Q3. Wiki 要涵蓋哪些範圍？（討論後決定的頁面清單）\n| 要回答的問題 | 對應頁面 |\n|---|---|\n| RAG 是什麼？名字從哪來？ | rag-definition、history-and-name |\n| 沒有 RAG 的 LLM 有什麼問題？ | llm-limitations |\n| 有沒有好懂的比喻？ | analogies |\n| RAG 怎麼運作？ | rag-pipeline、chunking-and-embedding、retrieval-methods |\n| 進階做法有哪些？ | contextual-retrieval、rag-paradigms |\n| 跟微調比起來怎樣？ | rag-vs-finetuning |\n| 怎麼知道 RAG 做得好不好？ | evaluation |\n| RAG 的限制？什麼時候不需要？ | limitations-and-when-not |\n| 實際用在哪？ | use-cases |\n| 名詞看不懂 | glossary |\n\n## Q4. 不收哪些東西？\n- **不使用課堂簡報**當來源（作業要求自己找）。\n- 不收沒有作者或機構的部落格、內容農場、二手轉貼文章。\n- 不寫程式碼實作細節（聽眾不是工程師），只保留概念。\n\n## Q5. 來源篩選標準\n1. 原始論文或綜述論文（學術可信度）→ S1、S6\n2. 大型科技公司官方文件 / 官方部落格（業界實務）→ S2、S3、S4、S5、S7\n3. 至少要有兩個來源能互相印證「RAG 的定義與流程」\n"}, "01-逐篇ingest討論": {"group": "討論紀錄", "md": "# 討論 01：逐篇 ingest 討論（先討論、後生成）\n\n> 做法：每讀完一篇來源，先跟 AI 討論「這篇的重點是什麼、跟其他來源有沒有衝突、要更新哪幾頁」，**確認後**才讓 AI 動手寫頁面。\n\n---\n\n## S1 Lewis et al. 2020（RAG 原始論文）\n- **重點**：RAG = 參數記憶（BART 生成器）+ 非參數記憶（Wikipedia 向量索引，用 DPR 檢索器）。兩種版本 RAG-Sequence / RAG-Token。\n- **討論**：論文數字很多（各資料集分數），對初學者太細 → Wiki 只留「Wikipedia 切成 100 字片段、共 2100 萬份文件」和「換索引就能更新知識」這個實驗。\n- **查證問題** ⚠：第一次用網頁版讀取時被截斷，世界領袖實驗的 70% / 68% / 12% / 4% 只出現在 AI 摘要裡，沒讀到原文 → **先不寫進 Wiki**，回到「取得資料」重新抓 PDF。\n- **重抓結果**：用 PDF 抽出文字後逐字確認：82 位世界領袖、2016 vs 2018 索引、70% / 68% / 12% / 4% 都正確 → 標為 ✅。\n- **要更新的頁面**：rag-definition、history-and-name、limitations-and-when-not（知識更新）、glossary\n\n## S2 AWS — What is RAG?\n- **重點**：定義（生成前先參考訓練資料以外的權威知識庫）、LLM 的 4 個問題、4 個好處、運作 4 步驟。\n- **討論**：AWS 的 4 步驟（建立外部資料 → 檢索 → 增強提示 → 更新外部資料）很適合當簡報的流程主軸。\n- **衝突檢查**：AWS 把「更新外部資料」當成一個步驟，Gao 綜述則是「索引 → 檢索 → 生成」三步。→ 討論後決定：簡報用「建索引 → 檢索 → 增強 → 生成」四格，「更新資料」放在旁邊當補充。兩者不矛盾，只是切法不同。\n- **要更新的頁面**：rag-definition、llm-limitations、rag-pipeline、analogies（新員工比喻）\n\n## S3 IBM Research Blog\n- **重點**：開書考 vs 閉卷考比喻；兩個階段（檢索、生成）；好處包括可引用來源、降低幻覺、減少敏感資料外洩、減少重新訓練成本；HR 請假的例子。\n- **討論**：「Alice 請半天假」這個例子很生活化，適合當簡報裡「走一遍」的例子。產假例子適合當開場的反例（沒有 RAG 時亂回答）。\n- **限制**：模型不知道自己不知道 → 放進 limitations 頁。\n- **要更新的頁面**：analogies、rag-pipeline、llm-limitations、limitations-and-when-not、use-cases\n\n## S4 NVIDIA Blog\n- **重點**：法官與書記官比喻；名稱由來（Patrick Lewis 說如果早知道會取更好聽的名字）；可以像論文註腳一樣引用來源。\n- **討論**：文章是 2023 年發表、2025 年更新，有提到 NVIDIA 自家產品 → 產品介紹不收，只收概念與比喻。\n- **要更新的頁面**：analogies、history-and-name、rag-pipeline、use-cases\n\n## S5 Anthropic — Contextual Retrieval\n- **重點**：一般 RAG 的做法（切片、embedding、BM25、合併）；片段失去上下文的問題；Contextual Retrieval 讓檢索失敗率下降 35% / 49% / 67%；知識庫小於 20 萬 tokens 可以直接整份放進提示。\n- **討論**：這是「進階」內容，但「片段看不出在講哪家公司」這個例子很好懂 → 簡報放一頁。「20 萬 tokens 以下不用 RAG」放進 limitations-and-when-not，讓聽眾知道 RAG 不是一定要用。\n- **注意**：35% / 49% / 67% 是「檢索失敗率的降幅」，不是準確率 → Wiki 要寫清楚，避免簡報寫錯。\n- **要更新的頁面**：chunking-and-embedding、retrieval-methods、contextual-retrieval、limitations-and-when-not\n\n## S6 Gao et al. — RAG Survey\n- **重點**：Naive / Advanced / Modular 三種 RAG；Naive RAG 的三類缺點；RAG vs 微調 vs 提示工程；評估：3 個品質分數 + 4 種能力。\n- **查證問題** ⚠：網頁版只讀到前 30%，評估章節來自 AI 摘要 → 回頭從 PDF 抽文字，逐字確認 3 個品質分數與 4 種能力的名稱與定義 → 標為 ✅。\n- **要更新的頁面**：rag-paradigms、rag-vs-finetuning、evaluation、rag-pipeline\n\n## S7 Microsoft Learn\n- **重點**：RAG 是把回答建立在自家內容上的模式；LLM 輸入長度有限，所以要切片；關鍵字、向量、混合搜尋、語意排序；「代理式檢索（agentic retrieval）」會把問題拆成多個子查詢。\n- **討論**：文件標題已改成「Foundry IQ」，跟網址不同，ingest 時記下來以免之後找不到。代理式檢索屬於最新發展 → 放在 rag-paradigms 當延伸。\n- **要更新的頁面**：retrieval-methods、chunking-and-embedding、rag-paradigms、use-cases\n"}, "log": {"group": "紀錄", "md": "---\ntitle: Wiki 操作紀錄（log）\nupdated: 2026-11-23\n---\n\n# Wiki 操作紀錄\n\n> 格式：`## [日期] 操作 | 內容`，最新的在最下面。\n\n## [2026-11-23] discuss | 主題與範圍\n- 決定主題 RAG、目標聽眾（非技術背景大學生）、頁面清單、來源篩選標準 → discussions/00\n\n## [2026-11-23] fetch | 取得 7 篇來源\n- S1 Lewis 2020、S2 AWS、S3 IBM、S4 NVIDIA、S5 Anthropic、S6 Gao 綜述、S7 Microsoft Learn\n- ⚠ 問題：S1、S6 的 arXiv 網頁版只讀到前 30–45%，後半是 AI 自動摘要；PDF 直接讀是亂碼\n\n## [2026-11-23] verify | 回到取得資料節點重抓\n- 改用 PyMuPDF 從 PDF 抽文字，逐字核對：\n  - S1 第 4.5 節：82 位世界領袖、70% / 68% / 12% / 4% ✅\n  - S1：100 字片段、21M 份文件 ✅\n  - S6 第七章 C 節：3 個品質分數、4 種能力 ✅\n- 發現：AI 摘要曾錯誤地說論文「沒有寫領袖人數」，原文其實有寫 82 位 → 證明摘要不能直接當來源\n\n## [2026-11-23] ingest | S1–S7 討論後寫入\n- 先寫 discussions/01（每篇的重點、衝突、要更新哪些頁）再生成頁面\n- 新增 14 個頁面：rag-definition、llm-limitations、analogies、history-and-name、rag-pipeline、chunking-and-embedding、retrieval-methods、contextual-retrieval、rag-paradigms、rag-vs-finetuning、evaluation、limitations-and-when-not、use-cases、glossary\n\n## [2026-11-23] lint | 第 1 次 → FAIL（8 個錯誤）\n- 6 個：有數字的句子沒附 [S#]（contextual-retrieval 3 處、limitations-and-when-not 3 處）\n- 2 個：llm-limitations 內文引用 S4、S7，frontmatter 沒列\n- 修正後第 2 次 → PASS（0 錯誤）\n\n## [2026-11-23] query | 為簡報查詢 Wiki\n- 依 3 個學習目標查詢：「RAG 是什麼」「怎麼運作」「限制與何時不用」→ 讀取 index → 選出 14 個頁面\n- 查詢心得：比喻分散在 analogies，例子分散在 rag-pipeline 和 use-cases，index 的一句話摘要幫助很大\n\n## [2026-11-23] slides v1 | 直接產生 HTML → 檢查 FAIL\n- 第 1 次：26 個錯誤，其中 16 個是檢查器 bug（把「Wiki：」的 iki 當成頁名）→ 修檢查器\n- 第 2 次：10 個真正的錯誤：2 個 Wiki 沒有的數字（15 分鐘、50 頁）、8 個術語第一次出現沒解釋\n\n## [2026-11-23] workflow v2 | 新增「大綱 + 大綱檢查」節點\n- 在產生 HTML 之前先寫 slides/outline.md（每頁的 wiki、數字、新術語、重點）\n- check_outline.py 第 1 次 → PASS；回測：把 v1 錯誤放回大綱 → 抓到 5 個錯誤，確認檢查有效\n- 依大綱重新產生 HTML → check_slides.py → PASS（0 錯誤）\n"}, "CLAUDE": {"group": "紀錄", "md": "# LLM Wiki 規則書（Schema）— 主題：RAG 檢索增強生成\n\n> 這份檔案是給 AI 看的「Wiki 維護規則」。每次請 AI ingest、查詢或檢查 Wiki 時，都先把這份規則給它。\n\n## 1. 資料夾結構\n\n```\nwiki/\n├── CLAUDE.md          ← 本規則書\n├── raw/               ← 原始來源筆記（S1~S7），ingest 後「不再修改」\n├── discussions/       ← 「先討論、後生成」的討論紀錄\n├── pages/             ← AI 維護的 Wiki 頁面（概念頁）\n├── index.md           ← 目錄：所有頁面 + 一句話摘要\n└── log.md             ← 時間軸：每次 ingest / query / lint 都記一筆\n```\n\n## 2. 三種操作\n\n| 操作 | 做什麼 | 產出 |\n|---|---|---|\n| **Ingest** | 讀一篇新來源 → 先寫討論紀錄 → 決定要更新哪些頁面 → 更新頁面 | raw/Sx.md、discussions/、pages/ 更新、log.md 一筆 |\n| **Query** | 依問題查 index.md → 讀相關頁面 → 回答並標出處；好的回答可回存成新頁面 | 回答（附 [[頁面]] 與 [S#]） |\n| **Lint** | 跑 `pipeline/lint_wiki.py` 檢查出處、連結、孤兒頁、待查證項目 | runs/ 內的檢查紀錄 |\n\n## 3. 寫作規則（硬性）\n\n1. **每個頁面開頭要有 frontmatter**：`title`、`sources`（例如 `[S1, S3]`）、`updated`。\n2. **有數字的句子，同一行一定要附來源 `[S#]`**。數字必須在 raw 筆記裡被標為「✅ 逐字確認」才可以寫進 pages。\n3. 只寫來源裡有的內容。自己的整理或比喻要標 `（整理）`。\n4. 頁面之間用 `[[頁面檔名]]` 互相連結；新頁面一定要加進 `index.md`。\n5. 來源沒查證完的內容，用 `⚠待查證` 標起來，**不可以**被簡報引用。\n6. 用語統一：Retrieval-Augmented Generation → 「檢索增強生成（RAG）」；embedding → 「向量嵌入（embedding）」；chunk → 「文件片段（chunk）」。\n\n## 4. 來源編號\n\n| ID | 來源 | 類型 |\n|---|---|---|\n| S1 | Lewis et al. (2020) RAG 原始論文，NeurIPS 2020 | 學術論文 |\n| S2 | AWS — What is RAG? | 雲端廠商官方說明 |\n| S3 | IBM Research Blog — What is RAG? (2023) | 研究機構部落格 |\n| S4 | NVIDIA Blog — What Is RAG, aka RAG? (2023, 2025 更新) | 業界官方部落格 |\n| S5 | Anthropic — Introducing Contextual Retrieval (2024) | AI 公司技術文章 |\n| S6 | Gao et al. (2023/2024) RAG for LLMs: A Survey | 學術綜述論文 |\n| S7 | Microsoft Learn — RAG in Azure AI Search | 官方技術文件 |\n"}}};
var rawKey = {};
DATA.order.forEach(function(k){ var m = k.match(/^(S\d)-/); if (m) rawKey[m[1]] = k; });

function splitFM(md){
  var m = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!m) return {fm:{}, body:md};
  var fm = {};
  m[1].split('\n').forEach(function(l){ var i = l.indexOf(':'); if (i > 0) fm[l.slice(0,i).trim()] = l.slice(i+1).trim(); });
  return {fm:fm, body:m[2]};
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function render(key){
  if (!DATA.docs[key]) key = 'index';
  var d = splitFM(DATA.docs[key].md);
  var body = d.body
    .replace(/\[\[([^\]]+)\]\]/g, function(_, k){ return '<a class="wl" href="#' + k + '">' + k + '</a>'; })
    .replace(/\[(S\d)\]/g, function(_, s){ return '<a class="src" href="#' + (rawKey[s] || '') + '">' + s + '</a>'; });
  document.getElementById('doc').innerHTML = marked.parse(body);
  var meta = '';
  ['sources','updated','type','dates','url'].forEach(function(f){ if (d.fm[f]) meta += '<span>' + f + '：' + esc(d.fm[f]) + '</span>'; });
  document.getElementById('meta').innerHTML = meta;
  document.querySelectorAll('#nav a').forEach(function(a){ a.classList.toggle('on', a.getAttribute('href') === '#' + key); });
  window.scrollTo(0, 0);
}
function buildNav(filter){
  var html = '', group = null;
  DATA.order.forEach(function(k){
    var doc = DATA.docs[k];
    if (filter && doc.md.toLowerCase().indexOf(filter.toLowerCase()) < 0) return;
    if (doc.group !== group){ group = doc.group; html += '<h4>' + group + '</h4>'; }
    var t = splitFM(doc.md).fm.title || k;
    html += '<a href="#' + k + '">' + esc(t.replace(/^"|"$/g, '')) + '</a>';
  });
  document.getElementById('nav').innerHTML = html || '<div class="sub">找不到</div>';
}
document.getElementById('q').addEventListener('input', function(e){ buildNav(e.target.value); });
window.addEventListener('hashchange', function(){ render(decodeURIComponent(location.hash.slice(1))); });
buildNav('');
render(decodeURIComponent(location.hash.slice(1)) || 'index');
</script>
</body>
</html>
